name: Build Windows Print Server EXE
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "print-server/**"
      - ".github/workflows/windows-print-server.yml"
  push:
    branches: [main]
    paths:
      - "print-server/**"
      - ".github/workflows/windows-print-server.yml"
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: print-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm install --no-save electron@38 electron-builder@26
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: POP9-Print-Server-Windows
          path: print-server/dist/*.exe
          if-no-files-found: error
      # Publica o .exe numa versão pública fixa do GitHub, baixada pelo botão em Admin → Impressoras.
      - name: Publicar para download no POP9
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/POP9-Print-Server-Windows.exe
          gh release view print-server-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create print-server-latest --repo $env:GITHUB_REPOSITORY --title "POP9 Print Server (Windows)" --notes "Versão mais recente do POP9 Print Server para Windows. Baixe pelo POP9 em Admin → Impressoras." --latest=false
          }
          gh release upload print-server-latest dist/POP9-Print-Server-Windows.exe --repo $env:GITHUB_REPOSITORY --clobber
