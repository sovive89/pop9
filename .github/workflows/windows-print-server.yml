name: Build Windows Print Server EXE
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "print-server/**"
      - ".github/workflows/windows-print-server.yml"
  push:
    branches: [main]
    paths:
      - "print-server/**"
      - ".github/workflows/windows-print-server.yml"
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: print-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm install --no-save electron@38 electron-builder@26
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: POP9-Print-Server-Windows
          path: print-server/dist/*.exe
          if-no-files-found: error
