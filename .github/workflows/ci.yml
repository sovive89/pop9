name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 37 erros pré-existentes no lint (não relacionados a este workflow) —
      # não-bloqueante por enquanto, só informativo até virarem dívida paga.
      - run: npm run lint
        continue-on-error: true

      # 10 erros pré-existentes de tipo (useSessionStore, useTableZones, CRMTab,
      # ActiveOrdersPanel). Informativo por enquanto; o objetivo é não aumentar.
      - run: npx tsc -p tsconfig.app.json --noEmit
        continue-on-error: true

      - run: npm run test

      - run: npm run build
