name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint bloqueante: hoje tem 0 erros (só avisos), então um erro novo derruba o CI.
      - run: npm run lint

      # Alertas altos/críticos de dependências de produção ficam visíveis no log, mas ainda não
      # bloqueiam: há dívida pré-existente (ver docs/seguranca-dependencias.md).
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - run: npm run test

      - run: npm run build
