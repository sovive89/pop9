name: Windows Print Agent

on:
  pull_request:
    paths:
      - 'print-agent/**'
      - '.github/workflows/build-print-agent.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'print-agent/**'
      - '.github/workflows/build-print-agent.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r print-agent/requirements.txt pyinstaller
      - name: Build Windows EXE
        run: pyinstaller --onefile --name POP9-Print-Agent --collect-all win32print print-agent/agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: POP9-Print-Agent-Windows
          path: dist/POP9-Print-Agent.exe
          if-no-files-found: error
